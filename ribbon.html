<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBj Studio - Icon Ribbon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .theme-light-blue {
            background-color: #f0f9ff;
            border-color: #bae6fd;
            color: #0369a1;
        }
        .theme-light-blue:hover, .theme-light-blue:active {
            background-color: #e0f2fe;
        }

        .theme-medium-blue {
            background-color: #e0f2fe;
            border-color: #7dd3fc;
            color: #0284c7;
        }
        .theme-medium-blue:hover, .theme-medium-blue:active {
            background-color: #bae6fd;
        }

        .theme-medium-dark-blue {
            background-color: #eff6ff;
            border-color: #bfdbfe;
            color: #1d4ed8;
        }
        .theme-medium-dark-blue:hover, .theme-medium-dark-blue:active {
            background-color: #dbeafe;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">TOBj Studio Ribbon</h1>
                <p class="text-sm text-slate-400">Icon-only toolbar grouped by execution hierarchy (Block, Inline-Block, Inline).</p>
            </div>
            <div class="flex items-center gap-3 mt-4 md:mt-0 text-xs">
                <span class="flex items-center gap-1.5 px-2.5 py-1 rounded bg-sky-950/60 border border-sky-800 text-sky-300">
                    <span class="w-2 h-2 rounded-full bg-sky-400"></span> Block
                </span>
                <span class="flex items-center gap-1.5 px-2.5 py-1 rounded bg-blue-950/60 border border-blue-800 text-blue-300">
                    <span class="w-2 h-2 rounded-full bg-blue-400"></span> Inline-Block
                </span>
                <span class="flex items-center gap-1.5 px-2.5 py-1 rounded bg-indigo-950/60 border border-indigo-800 text-indigo-300">
                    <span class="w-2 h-2 rounded-full bg-indigo-500"></span> Inline
                </span>
            </div>
        </header>

        <!-- Ribbon Container Grouped by Type -->
        <main id="ribbon-container" class="space-y-4">
            <!-- Populated dynamically -->
        </main>
    </div>

    <!-- Custom Shared Tooltip Element (Supports iOS & Desktop) -->
    <div id="custom-tooltip" class="fixed z-50 px-3 py-1.5 text-xs bg-slate-950 text-slate-100 border border-slate-700 rounded-md shadow-xl pointer-events-none hidden max-w-xs transition-opacity duration-100 opacity-0"></div>

    <script>
        const REG_ATTR = {
          "__left": { type: "block", label: "Left", category: "Alignment", syntax: "__left", result: "Align block content to the left", icon: "align-left", theme: "theme-light-blue" },
          "__center": { type: "block", label: "Center", category: "Alignment", syntax: "__center", result: "Center-align block content", icon: "align-center", theme: "theme-light-blue" },
          "__right": { type: "block", label: "Right", category: "Alignment", syntax: "__right", result: "Align block content to the right", icon: "align-right", theme: "theme-light-blue" },
          "__center_block": { type: "block", label: "Center Block", category: "Alignment", syntax: "__center_block", result: "Center block element horizontally with auto margins", icon: "align-horizontal-space-center", theme: "theme-light-blue" },
          "__float_left": { type: "block", label: "Float Left", category: "Alignment", syntax: "__float_left", result: "Float element to the left side", icon: "move-left", theme: "theme-light-blue" },
          "__float_right": { type: "block", label: "Float Right", category: "Alignment", syntax: "__float_right", result: "Float element to the right side", icon: "move-right", theme: "theme-light-blue" },
          "__bgcolor": { type: "block", label: "Bg Color", category: "Background", syntax: "__bgcolor(value)", result: "Set block background color", icon: "paint-bucket", theme: "theme-light-blue" },
          "__border": { type: "block", label: "Border", category: "Background", syntax: "__border", result: "Add a solid border around block", icon: "square", theme: "theme-light-blue" },
          "__rounded": { type: "block", label: "Rounded", category: "Background", syntax: "__rounded", result: "Apply rounded corners (8px radius)", icon: "circle", theme: "theme-light-blue" },
          "__shadow": { type: "block", label: "Shadow", category: "Background", syntax: "__shadow", result: "Add drop shadow effect to block", icon: "layers", theme: "theme-light-blue" },
          "__margin": { type: "block", label: "Margin", category: "Spacing", syntax: "__margin(value)", result: "Set margin spacing on all sides", icon: "maximize", theme: "theme-light-blue" },
          "__margin_top": { type: "block", label: "Margin Top", category: "Spacing", syntax: "__margin_top(value)", result: "Set top margin spacing", icon: "arrow-up-to-line", theme: "theme-light-blue" },
          "__margin_bottom": { type: "block", label: "Margin Bottom", category: "Spacing", syntax: "__margin_bottom(value)", result: "Set bottom margin spacing", icon: "arrow-down-to-line", theme: "theme-light-blue" },
          "__margin_vertical": { type: "block", label: "Margin Vert", category: "Spacing", syntax: "__margin_vertical(value)", result: "Set top and bottom margin spacing", icon: "move-vertical", theme: "theme-light-blue" },
          "__margin_horizontal": { type: "block", label: "Margin Horiz", category: "Spacing", syntax: "__margin_horizontal(value)", result: "Set left and right margin spacing", icon: "move-horizontal", theme: "theme-light-blue" },
          "__padding": { type: "block", label: "Padding", category: "Spacing", syntax: "__padding(value)", result: "Set internal padding on all sides", icon: "box-select", theme: "theme-light-blue" },
          "__padding_vertical": { type: "block", label: "Padding Vert", category: "Spacing", syntax: "__padding_vertical(value)", result: "Set top and bottom internal padding", icon: "move-vertical", theme: "theme-light-blue" },
          "__padding_horizontal": { type: "block", label: "Padding Horiz", category: "Spacing", syntax: "__padding_horizontal(value)", result: "Set left and right internal padding", icon: "move-horizontal", theme: "theme-light-blue" },
          "__width": { type: "block", label: "Width", category: "Dimension", syntax: "__width(value)", result: "Set explicit block width", icon: "move-horizontal", theme: "theme-light-blue" },
          "__height": { type: "block", label: "Height", category: "Dimension", syntax: "__height(value)", result: "Set explicit block height", icon: "move-vertical", theme: "theme-light-blue" },
          "__min_width": { type: "block", label: "Min Width", category: "Dimension", syntax: "__min_width(value)", result: "Set minimum width constraint", icon: "minimize-2", theme: "theme-light-blue" },
          "__max_width": { type: "block", label: "Max Width", category: "Dimension", syntax: "__max_width(value)", result: "Set maximum width constraint", icon: "maximize-2", theme: "theme-light-blue" },
          "__min_height": { type: "block", label: "Min Height", category: "Dimension", syntax: "__min_height(value)", result: "Set minimum height constraint", icon: "minimize-2", theme: "theme-light-blue" },
          "__max_height": { type: "block", label: "Max Height", category: "Dimension", syntax: "__max_height(value)", result: "Set maximum height constraint", icon: "maximize-2", theme: "theme-light-blue" },
          "__text_align_justify": { type: "block", label: "Justify", category: "Alignment", syntax: "__text_align_justify", result: "Justify block text alignment", icon: "align-justify", theme: "theme-light-blue" },
          "__columns": { type: "block", label: "Columns", category: "Layout", syntax: "__columns(value)", result: "Split block content into columns", icon: "columns-2", theme: "theme-light-blue" },
          "__column_gap": { type: "block", label: "Col Gap", category: "Layout", syntax: "__column_gap(value)", result: "Set gap spacing between columns", icon: "space", theme: "theme-light-blue" },
          "__column_rule": { type: "block", label: "Col Rule", category: "Layout", syntax: "__column_rule(value)", result: "Add a divider rule between columns", icon: "separator-vertical", theme: "theme-light-blue" },
          "__flex": { type: "block", label: "Flex", category: "Layout", syntax: "__flex", result: "Enable flexible box layout", icon: "layout-grid", theme: "theme-light-blue" },
          "__flex_center": { type: "block", label: "Flex Center", category: "Layout", syntax: "__flex_center", result: "Center flex items in both directions", icon: "align-center", theme: "theme-light-blue" },
          "__flex_column": { type: "block", label: "Flex Column", category: "Layout", syntax: "__flex_column", result: "Arrange flex items vertically", icon: "list", theme: "theme-light-blue" },
          "__absolute": { type: "block", label: "Absolute", category: "Layout", syntax: "__absolute", result: "Position element absolutely", icon: "locate", theme: "theme-light-blue" },
          "__relative": { type: "block", label: "Relative", category: "Layout", syntax: "__relative", result: "Position element relatively", icon: "compass", theme: "theme-light-blue" },
          "__sticky": { type: "block", label: "Sticky", category: "Layout", syntax: "__sticky", result: "Make element sticky during scroll", icon: "pin", theme: "theme-light-blue" },
          "__z_index": { type: "block", label: "Z-Index", category: "Layout", syntax: "__z_index(value)", result: "Control element layer stacking order", icon: "layers", theme: "theme-light-blue" },
          "__opacity": { type: "block", label: "Opacity", category: "Effects", syntax: "__opacity(value)", result: "Set element transparency", icon: "eye", theme: "theme-light-blue" },
          "__blockindent": { type: "block", label: "Block Indent", category: "Indentation", syntax: "__blockindent", result: "Indent entire block container (2em)", icon: "indent", theme: "theme-light-blue" },
          "__hanging_indent": { type: "block", label: "Hanging Indent", category: "Indentation", syntax: "__hanging_indent", result: "Apply hanging indent format", icon: "list-tree", theme: "theme-light-blue" },
          "__first_line_indent": { type: "block", label: "1st Line Indent", category: "Indentation", syntax: "__first_line_indent", result: "Indent only the first line of text", icon: "heading", theme: "theme-light-blue" },
          "__negative_indent": { type: "block", label: "Neg Indent", category: "Indentation", syntax: "__negative_indent", result: "Shift element left with negative margin", icon: "arrow-left-from-line", theme: "theme-light-blue" },
          "__outdent": { type: "block", label: "Outdent", category: "Indentation", syntax: "__outdent", result: "Outdent block with right padding compensation", icon: "arrow-left-from-line", theme: "theme-light-blue" },
          "__safe": { type: "block", label: "Safe Margins", category: "Layout", syntax: "__safe", result: "Apply reader safe margins avoiding UI overlays", icon: "shield", theme: "theme-light-blue" },
          
          // Inline-Block Items
          "__ibgcolor": { type: "inlineblock", label: "IBg Color", category: "Background", syntax: "__ibgcolor(value)", result: "Set inline-block background color", icon: "palette", theme: "theme-medium-blue" },
          "__iborder": { type: "inlineblock", label: "IBorder", category: "Background", syntax: "__iborder", result: "Add border to inline-block element", icon: "box", theme: "theme-medium-blue" },
          "__irounded": { type: "inlineblock", label: "IRounded", category: "Background", syntax: "__irounded", result: "Apply rounded glassmorphism style", icon: "circle", theme: "theme-medium-blue" },
          "__ishadow": { type: "inlineblock", label: "IShadow", category: "Background", syntax: "__ishadow", result: "Add shadow effect to inline-block", icon: "layers", theme: "theme-medium-blue" },
          "__imargin": { type: "inlineblock", label: "IMargin", category: "Spacing", syntax: "__imargin(value)", result: "Set inline-block margin on all sides", icon: "maximize", theme: "theme-medium-blue" },
          "__imargin_vertical": { type: "inlineblock", label: "IMargin Vert", category: "Spacing", syntax: "__imargin_vertical(value)", result: "Set vertical margin for inline-block", icon: "move-vertical", theme: "theme-medium-blue" },
          "__imargin_horizontal": { type: "inlineblock", label: "IMargin Horiz", category: "Spacing", syntax: "__imargin_horizontal(value)", result: "Set horizontal margin for inline-block", icon: "move-horizontal", theme: "theme-medium-blue" },
          "__ipadding": { type: "inlineblock", label: "IPadding", category: "Spacing", syntax: "__ipadding(value)", result: "Set internal padding for inline-block", icon: "box-select", theme: "theme-medium-blue" },
          "__ipadding_vertical": { type: "inlineblock", label: "IPadding Vert", category: "Spacing", syntax: "__ipadding_vertical(value)", result: "Set vertical padding for inline-block", icon: "move-vertical", theme: "theme-medium-blue" },
          "__ipadding_horizontal": { type: "inlineblock", label: "IPadding Horiz", category: "Spacing", syntax: "__ipadding_horizontal(value)", result: "Set horizontal padding for inline-block", icon: "move-horizontal", theme: "theme-medium-blue" },
          "__iwidth": { type: "inlineblock", label: "IWidth", category: "Dimension", syntax: "__iwidth(value)", result: "Set explicit inline-block width", icon: "move-horizontal", theme: "theme-medium-blue" },
          "__iheight": { type: "inlineblock", label: "IHeight", category: "Dimension", syntax: "__iheight(value)", result: "Set explicit inline-block height", icon: "move-vertical", theme: "theme-medium-blue" },
          "__imin_width": { type: "inlineblock", label: "IMin Width", category: "Dimension", syntax: "__imin_width(value)", result: "Set minimum width for inline-block", icon: "minimize-2", theme: "theme-medium-blue" },
          "__imax_width": { type: "inlineblock", label: "IMax Width", category: "Dimension", syntax: "__imax_width(value)", result: "Set maximum width for inline-block", icon: "maximize-2", theme: "theme-medium-blue" },
          "__imin_height": { type: "inlineblock", label: "IMin Height", category: "Dimension", syntax: "__imin_height(value)", result: "Set minimum height for inline-block", icon: "minimize-2", theme: "theme-medium-blue" },
          "__imax_height": { type: "inlineblock", label: "IMax Height", category: "Dimension", syntax: "__imax_height(value)", result: "Set maximum height for inline-block", icon: "maximize-2", theme: "theme-medium-blue" },
          "__iletter_spacing": { type: "inlineblock", label: "ILetter Space", category: "Typography", syntax: "__iletter_spacing(value)", result: "Adjust letter spacing for inline-block", icon: "fold-horizontal", theme: "theme-medium-blue" },
          "__itext_transform": { type: "inlineblock", label: "IText Xform", category: "Typography", syntax: "__itext_transform(value)", result: "Transform text case for inline-block", icon: "case-upper", theme: "theme-medium-blue" },
          "__ifont_weight": { type: "inlineblock", label: "IFont Weight", category: "Typography", syntax: "__ifont_weight(value)", result: "Set font weight for inline-block", icon: "bold", theme: "theme-medium-blue" },
          "__itext_shadow": { type: "inlineblock", label: "IText Shadow", category: "Typography", syntax: "__itext_shadow(value)", result: "Add text shadow for inline-block", icon: "sparkles", theme: "theme-medium-blue" },
          "__icolumns": { type: "inlineblock", label: "IColumns", category: "Layout", syntax: "__icolumns(value)", result: "Split inline-block content into columns", icon: "columns-2", theme: "theme-medium-blue" },
          "__iindent": { type: "inlineblock", label: "IIndent", category: "Indentation", syntax: "__iindent", result: "Indent inline-block content (2em)", icon: "indent", theme: "theme-medium-blue" },
          "__ihanging_indent": { type: "inlineblock", label: "IHanging Ind", category: "Indentation", syntax: "__ihanging_indent", result: "Apply hanging indent to inline-block", icon: "list-tree", theme: "theme-medium-blue" },
          "__ifirst_line_indent": { type: "inlineblock", label: "I1st Line Ind", category: "Indentation", syntax: "__ifirst_line_indent", result: "Indent first line of inline-block text", icon: "heading", theme: "theme-medium-blue" },
          "__ioutdent": { type: "inlineblock", label: "IOutdent", category: "Indentation", syntax: "__ioutdent", result: "Pull inline-block left (outdent)", icon: "arrow-left-from-line", theme: "theme-medium-blue" },
          "__iopacity": { type: "inlineblock", label: "IOpacity", category: "Effects", syntax: "__iopacity(value)", result: "Set inline-block transparency", icon: "eye", theme: "theme-medium-blue" },
          "__itransform": { type: "inlineblock", label: "ITransform", category: "Effects", syntax: "__itransform(value)", result: "Apply CSS transform to inline-block", icon: "rotate-cw", theme: "theme-medium-blue" },
          "__icenter": { type: "inlineblock", label: "ICenter", category: "Alignment", syntax: "__icenter", result: "Center text inside inline-block", icon: "align-center", theme: "theme-medium-blue" },
          "__itext_align_justify": { type: "inlineblock", label: "IJustify", category: "Alignment", syntax: "__itext_align_justify", result: "Justify text inside inline-block", icon: "align-justify", theme: "theme-medium-blue" },

          // Inline Items
          "_bold": { type: "inline", label: "Bold", category: "Text Styling", syntax: "_bold", result: "Apply bold weight to text", icon: "bold", theme: "theme-medium-dark-blue" },
          "_italic": { type: "inline", label: "Italic", category: "Text Styling", syntax: "_italic", result: "Apply italic style to text", icon: "italic", theme: "theme-medium-dark-blue" },
          "_underline": { type: "inline", label: "Underline", category: "Text Styling", syntax: "_underline", result: "Underline text content", icon: "underline", theme: "theme-medium-dark-blue" },
          "_box": { type: "inline", label: "Box", category: "Text Styling", syntax: "_box", result: "Wrap inline text in a border box", icon: "square-dashed", theme: "theme-medium-dark-blue" },
          "_fontup": { type: "inline", label: "Font Up", category: "Text Styling", syntax: "_fontup", result: "Increase font size by 20%", icon: "arrow-up-from-line", theme: "theme-medium-dark-blue" },
          "_fontdn": { type: "inline", label: "Font Down", category: "Text Styling", syntax: "_fontdn", result: "Decrease font size by 20%", icon: "arrow-down-to-line", theme: "theme-medium-dark-blue" },
          "_superscript": { type: "inline", label: "Superscript", category: "Special", syntax: "_superscript", result: "Format text as superscript", icon: "superscript", theme: "theme-medium-dark-blue" },
          "_subscript": { type: "inline", label: "Subscript", category: "Special", syntax: "_subscript", result: "Format text as subscript", icon: "subscript", theme: "theme-medium-dark-blue" },
          "_fontsize": { type: "inline", label: "Font Size", category: "Text Styling", syntax: "_fontsize(value)", result: "Set precise font size in rem units", icon: "type", theme: "theme-medium-dark-blue" },
          "_color": { type: "inline", label: "Color", category: "Colors", syntax: "_color(value)", result: "Set text font color", icon: "droplet", theme: "theme-medium-dark-blue" },
          "_bgcolor": { type: "inline", label: "Bg Color", category: "Colors", syntax: "_bgcolor(value)", result: "Set background color for inline text", icon: "highlighter", theme: "theme-medium-dark-blue" },
          "_fontfamily": { type: "inline", label: "Font Family", category: "Text Styling", syntax: "_fontfamily(value)", result: "Change text font family", icon: "case-sensitive", theme: "theme-medium-dark-blue" },
          "_clickme_str": { type: "inline", label: "ClickMe", category: "Special", syntax: "_clickme_str", result: "Style text as an interactive glass button", icon: "mouse-pointer-click", theme: "theme-medium-dark-blue" },
          "_overline": { type: "inline", label: "Overline", category: "Text Styling", syntax: "_overline", result: "Add an overline above text", icon: "overline", theme: "theme-medium-dark-blue" },
          "_line_through": { type: "inline", label: "Strikethrough", category: "Text Styling", syntax: "_line_through", result: "Add a strikethrough line across text", icon: "strikethrough", theme: "theme-medium-dark-blue" },
          "_double_underline": { type: "inline", label: "Dbl Underline", category: "Text Styling", syntax: "_double_underline", result: "Add a double underline below text", icon: "underline", theme: "theme-medium-dark-blue" },
          "_wavy_underline": { type: "inline", label: "Wavy Underline", category: "Text Styling", syntax: "_wavy_underline", result: "Add a wavy underline below text", icon: "activity", theme: "theme-medium-dark-blue" },
          "_dotted_underline": { type: "inline", label: "Dot Underline", category: "Text Styling", syntax: "_dotted_underline", result: "Add a dotted underline below text", icon: "more-horizontal", theme: "theme-medium-dark-blue" },
          "_dashed_underline": { type: "inline", label: "Dash Underline", category: "Text Styling", syntax: "_dashed_underline", result: "Add a dashed underline below text", icon: "minus", theme: "theme-medium-dark-blue" },
          "_tab": { type: "inline", label: "Tab", category: "Special", syntax: "_tab", result: "Insert a tab indent (2em margin)", icon: "indent", theme: "theme-medium-dark-blue" },
          "_uppercase": { type: "inline", label: "Uppercase", category: "Text Styling", syntax: "_uppercase", result: "Convert text characters to uppercase", icon: "case-upper", theme: "theme-medium-dark-blue" },
          "_lowercase": { type: "inline", label: "Lowercase", category: "Text Styling", syntax: "_lowercase", result: "Convert text characters to lowercase", icon: "case-lower", theme: "theme-medium-dark-blue" },
          "_capitalize": { type: "inline", label: "Capitalize", category: "Text Styling", syntax: "_capitalize", result: "Capitalize the first letter of each word", icon: "case-sensitive", theme: "theme-medium-dark-blue" },
          "_small_caps": { type: "inline", label: "Small Caps", category: "Text Styling", syntax: "_small_caps", result: "Display text in small capital letters", icon: "type", theme: "theme-medium-dark-blue" },
          "_letter_spacing": { type: "inline", label: "Letter Space", category: "Spacing", syntax: "_letter_spacing(value)", result: "Adjust letter spacing (tracking)", icon: "fold-horizontal", theme: "theme-medium-dark-blue" },
          "_word_spacing": { type: "inline", label: "Word Space", category: "Spacing", syntax: "_word_spacing(value)", result: "Adjust spacing between words", icon: "space", theme: "theme-medium-dark-blue" },
          "_line_height": { type: "inline", label: "Line Height", category: "Spacing", syntax: "_line_height(value)", result: "Adjust line height (vertical spacing)", icon: "list-collapse", theme: "theme-medium-dark-blue" },
          "_font_weight": { type: "inline", label: "Font Weight", category: "Text Styling", syntax: "_font_weight(value)", result: "Set custom numeric font weight", icon: "bold", theme: "theme-medium-dark-blue" },
          "_text_outline": { type: "inline", label: "Text Outline", category: "Text Styling", syntax: "_text_outline(value)", result: "Add an outline stroke to text", icon: "pen-tool", theme: "theme-medium-dark-blue" }
        };

        const typeGroups = {
            "block": { title: "Block Attributes", items: [] },
            "inlineblock": { title: "Inline-Block Attributes", items: [] },
            "inline": { title: "Inline Attributes", items: [] }
        };

        for (const [key, attr] of Object.entries(REG_ATTR)) {
            const t = attr.type;
            if (typeGroups[t]) {
                typeGroups[t].items.push({ key, ...attr });
            }
        }

        const container = document.getElementById('ribbon-container');
        const tooltip = document.getElementById('custom-tooltip');
        let activeTouchTimer = null;

        for (const [groupKey, groupData] of Object.entries(typeGroups)) {
            if (groupData.items.length === 0) continue;

            const section = document.createElement('div');
            section.className = "bg-slate-800/80 border border-slate-700/60 rounded-lg p-3.5 shadow-sm";
            
            const title = document.createElement('h2');
            title.className = "text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 px-1 border-b border-slate-700/50 pb-1.5";
            title.textContent = groupData.title;
            section.appendChild(title);

            const btnWrapper = document.createElement('div');
            btnWrapper.className = "flex flex-wrap gap-1.5";

            groupData.items.forEach(item => {
                const btn = document.createElement('button');
                
                // Formats as requested: block: label: result
                const tooltipText = `${item.type}: ${item.label}: ${item.result}`;
                
                btn.className = `p-2.5 rounded-md border transition-all duration-150 cursor-pointer flex items-center justify-center shadow-2xs ${item.theme}`;
                btn.innerHTML = `<i data-lucide="${item.icon || 'circle'}" class="w-4 h-4"></i>`;

                const showTooltip = () => {
                    tooltip.textContent = tooltipText;
                    tooltip.classList.remove('hidden');
                    
                    const rect = btn.getBoundingClientRect();
                    let left = rect.left + (rect.width / 2) - (tooltip.offsetWidth / 2);
                    let top = rect.bottom + 6;

                    if (left < 10) left = 10;
                    if (left + 220 > window.innerWidth) left = window.innerWidth - 230;
                    if (top + 50 > window.innerHeight) top = rect.top - 42;

                    tooltip.style.left = `${left}px`;
                    tooltip.style.top = `${top}px`;
                    
                    setTimeout(() => tooltip.classList.remove('opacity-0'), 10);
                };

                const hideTooltip = () => {
                    tooltip.classList.add('opacity-0');
                    setTimeout(() => tooltip.classList.add('hidden'), 100);
                };

                btn.addEventListener('mouseenter', showTooltip);
                btn.addEventListener('mouseleave', hideTooltip);

                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    showTooltip();
                    if (activeTouchTimer) clearTimeout(activeTouchTimer);
                    activeTouchTimer = setTimeout(hideTooltip, 3000);
                }, { passive: false });

                btn.addEventListener('click', () => {
                    console.log(`Action executed: ${item.syntax}`);
                });

                btnWrapper.appendChild(btn);
            });

            section.appendChild(btnWrapper);
            container.appendChild(section);
        }

        document.addEventListener('touchstart', (e) => {
            if (!e.target.closest('button')) {
                tooltip.classList.add('opacity-0');
                setTimeout(() => tooltip.classList.add('hidden'), 100);
            }
        });

        lucide.createIcons();
    </script>
</body>
</html>
