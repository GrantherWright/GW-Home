<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBj Studio - Custom Markup Editor & HTML Converter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 h-screen flex flex-col font-sans overflow-hidden transition-colors duration-200">

    <!-- Top Ribbon / Navbar -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-2 flex items-center justify-between shadow-sm transition-colors duration-200">
        <div class="flex items-center space-x-3">
            <div class="bg-purple-600 text-white p-2 rounded-lg font-bold text-lg flex items-center justify-center w-10 h-10 shadow-sm">
                <i data-lucide="code-xml"></i>
            </div>
            <div>
                <h1 class="font-bold text-gray-800 dark:text-gray-100 text-lg leading-tight">TOBj Studio</h1>
                <p class="text-xs text-gray-500 dark:text-gray-400">Custom Markup Engine & HTML Exporter</p>
            </div>
        </div>

        <!-- Action Toolbar Buttons -->
        <div class="flex items-center space-x-2">
            <!-- Dark Mode Toggle -->
            <button onclick="toggleDarkMode()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-md transition border border-gray-200 dark:border-gray-700" title="Toggle Dark Mode">
                <i data-lucide="moon" id="dark-mode-icon"></i>
            </button>
            <button onclick="copyTOBj()" class="flex items-center space-x-1.5 px-3 py-1.5 bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 text-sm font-medium rounded-md transition border border-gray-300 dark:border-gray-600" title="Copy native TOBj syntax to clipboard">
                <i data-lucide="copy" class="w-4 h-4"></i>
                <span>Copy TOBj</span>
            </button>
            <button onclick="copyHTML()" class="flex items-center space-x-1.5 px-3 py-1.5 bg-purple-50 dark:bg-purple-900/30 hover:bg-purple-100 dark:hover:bg-purple-900/50 text-purple-600 dark:text-purple-400 text-sm font-medium rounded-md transition border border-purple-200 dark:border-purple-800" title="Convert TOBj to HTML and copy to clipboard">
                <i data-lucide="file-code" class="w-4 h-4"></i>
                <span>Convert & Copy HTML</span>
            </button>
            <button onclick="clearEditor()" class="flex items-center space-x-1.5 px-3 py-1.5 bg-red-50 dark:bg-red-900/30 hover:bg-red-100 dark:hover:bg-red-900/50 text-red-600 dark:text-red-400 text-sm font-medium rounded-md transition border border-red-200 dark:border-red-800" title="Clear Editor">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
                <span>Clear</span>
            </button>
        </div>
    </header>

    <!-- Ribbon Formatting Toolbar -->
    <div class="bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-2 flex flex-wrap items-center gap-3 text-sm shadow-inner transition-colors duration-200">
        <!-- Block Group (__) -->
        <div class="flex items-center space-x-1 bg-white dark:bg-gray-900 px-2 py-1 rounded border border-gray-200 dark:border-gray-700 shadow-xs">
            <span class="text-xs font-semibold text-purple-500 uppercase tracking-wider mr-1">Block (__)</span>
            <button onclick="insertSnippet('__center', 'Hello')" class="px-2 py-1 hover:bg-gray-100 dark:hover:bg-gray-800 rounded text-gray-700 dark:text-gray-300 transition text-xs font-mono" title="Center Alignment">Center</button>
            <button onclick="insertSnippet('__bgcolor(#f0f0f0)', 'Hello')" class="px-2 py-1 hover:bg-gray-100 dark:hover:bg-gray-800 rounded text-gray-700 dark:text-gray-300 transition text-xs font-mono" title="Background Color">BgColor</button>
            <button onclick="insertSnippet('__padding(1rem)', 'Hello')" class="px-2 py-1 hover:bg-gray-100 dark:hover:bg-gray-800 rounded text-gray-700 dark:text-gray-300 transition text-xs font-mono" title="Padding">Padding</button>
        </div>

        <!-- Inline-Block Group (_i) -->
        <div class="flex items-center space-x-1 bg-white dark:bg-gray-900 px-2 py-1 rounded border border-gray-200 dark:border-gray-700 shadow-xs">
            <span class="text-xs font-semibold text-blue-500 uppercase tracking-wider mr-1">Inline-Block (_i)</span>
            <button onclick="insertSnippet('_ibgcolor(#eee)', 'Hello')" class="px-2 py-1 hover:bg-gray-100 dark:hover:bg-gray-800 rounded text-gray-700 dark:text-gray-300 transition text-xs font-mono" title="Inline Block Background">iBgColor</button>
            <button onclick="insertSnippet('_ipadding(0.5rem)', 'Hello')" class="px-2 py-1 hover:bg-gray-100 dark:hover:bg-gray-800 rounded text-gray-700 dark:text-gray-300 transition text-xs font-mono" title="Inline Block Padding">iPadding</button>
        </div>

        <!-- Inline Group (_) -->
        <div class="flex items-center space-x-1 bg-white dark:bg-gray-900 px-2 py-1 rounded border border-gray-200 dark:border-gray-700 shadow-xs">
            <span class="text-xs font-semibold text-emerald-500 uppercase tracking-wider mr-1">Inline (_)</span>
            <button onclick="insertSnippet('_bold', 'Hello')" class="px-2 py-1 hover:bg-gray-100 dark:hover:bg-gray-800 rounded text-gray-700 dark:text-gray-300 transition text-xs font-bold" title="Bold">Bold</button>
            <button onclick="insertSnippet('_italic', 'Hello')" class="px-2 py-1 hover:bg-gray-100 dark:hover:bg-gray-800 rounded text-gray-700 dark:text-gray-300 transition text-xs italic" title="Italic">Italic</button>
            <button onclick="insertSnippet('_color(red)', 'Hello')" class="px-2 py-1 hover:bg-gray-100 dark:hover:bg-gray-800 rounded text-gray-700 dark:text-gray-300 transition text-xs font-mono" title="Color">Color</button>
        </div>

        <!-- Combined Full Example -->
        <div class="flex items-center space-x-1 bg-white dark:bg-gray-900 px-2 py-1 rounded border border-gray-200 dark:border-gray-700 shadow-xs">
            <button onclick="insertRule5Example()" class="px-2 py-1 bg-purple-50 dark:bg-purple-900/30 hover:bg-purple-100 text-purple-600 dark:text-purple-300 rounded transition text-xs font-semibold flex items-center gap-1">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Insert Combined Rule 5 Demo
            </button>
        </div>
    </div>

    <!-- Main Split-Pane Workspace -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden p-4 gap-4 bg-gray-100 dark:bg-gray-900 transition-colors duration-200">
        <!-- Editor Pane -->
        <div class="flex-1 flex flex-col bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden transition-colors duration-200">
            <div class="bg-gray-50 dark:bg-gray-800 px-4 py-2 border-b border-gray-200 dark:border-gray-700 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider flex justify-between items-center">
                <span>TOBj Input Syntax</span>
                <span id="stats" class="text-gray-400 dark:text-gray-500 font-normal normal-case">0 chars</span>
            </div>
            <textarea id="tobj-input" class="flex-1 p-4 resize-none outline-none font-mono text-sm text-gray-800 dark:text-gray-200 bg-transparent leading-relaxed" placeholder="Type TOBj markup like {[ __center; _bold ]} [[Hello World]]..."></textarea>
        </div>

        <!-- Live Preview Pane -->
        <div class="flex-1 flex flex-col bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden transition-colors duration-200">
            <div class="bg-gray-50 dark:bg-gray-800 px-4 py-2 border-b border-gray-200 dark:border-gray-700 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                Live Rendered Preview & Generated HTML
            </div>
            <div id="preview-output" class="flex-1 p-6 overflow-y-auto text-gray-800 dark:text-gray-200 bg-white dark:bg-gray-800 space-y-4">
                <!-- Rendered output appears here -->
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 dark:bg-gray-700 text-white px-4 py-2 rounded-lg shadow-lg text-sm transition-opacity duration-300 opacity-0 pointer-events-none z-50 border border-gray-800">
        Copied to clipboard!
    </div>

    <!-- TOBj Parser & Application Logic -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        const input = document.getElementById('tobj-input');
        const preview = document.getElementById('preview-output');
        const stats = document.getElementById('stats');

        // Load saved content from LocalStorage or default sample (Rule 5 demo)
        const savedTOBj = localStorage.getItem('tobj_content');
        if (savedTOBj !== null) {
            input.value = savedTOBj;
        } else {
            input.value = "{[ __center; _i_ibgcolor(#eee); _bold; _color(red) ]} [[Hello World]]";
        }

        // Dark Mode State Management
        if (localStorage.getItem('tobj_theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.getElementById('dark-mode-icon').setAttribute('data-lucide', 'sun');
            lucide.createIcons();
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('tobj_theme', isDark ? 'dark' : 'light');
            document.getElementById('dark-mode-icon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        }

        // Custom TOBj Parser Engine (Following Rules 1-9)
        function parseTOBj(text) {
            // Regex to match {[ attributes ]} [[ content ]]
            // Handles nesting recursively by processing inner matches first
            const tobjRegex = /\{\[\s*([^\]]*?)\s*\]\}\s*\[\[([\s\S]*?)\]\]/;

            let currentText = text;
            let match;

            // Loop to handle nested TOBj (Rule 7 & 8)
            while ((match = tobjRegex.exec(currentText)) !== null) {
                const fullMatch = match[0];
                const rawAttrs = match[1];
                let innerContent = match[2];

                // Recursively parse inner content first if it contains TOBj
                innerContent = parseTOBj(innerContent);

                // Split attributes by semicolon (Rule 2)
                const attrList = rawAttrs.split(';').map(a => a.trim()).filter(a => a.length > 0);

                let blockStyles = [];
                let inlineBlockStyles = [];
                let inlineStyles = [];

                // Categorize attributes (Rule 3)
                attrList.forEach(attr => {
                    let cssProp = '';
                    let valMatch = attr.match(/\((.*?)\)/);
                    let val = valMatch ? valMatch[1] : '';
                    let cleanName = attr.replace(/\(.*\)/, '').trim();

                    // Map attributes to CSS styles
                    if (cleanName.startsWith('__')) {
                        // Block level (__)
                        let propName = cleanName.substring(2);
                        if (propName === 'center') cssProp = 'text-align: center;';
                        else if (propName === 'bgcolor') cssProp = `background-color: ${val};`;
                        else if (propName === 'padding') cssProp = `padding: ${val};`;
                        else cssProp = `${propName.replace(/_/g, '-')}: ${val || 'initial'};`;
                        blockStyles.push(cssProp);
                    } 
                    else if (cleanName.startsWith('_i')) {
                        // Inline-block level (_i)
                        let propName = cleanName.substring(2); // removes _i
                        if (propName === 'ibgcolor' || propName === 'bgcolor') cssProp = `background-color: ${val};`;
                        else if (propName === 'ipadding' || propName === 'padding') cssProp = `padding: ${val};`;
                        else cssProp = `${propName.replace(/_/g, '-')}: ${val || 'initial'};`;
                        inlineBlockStyles.push(cssProp);
                    } 
                    else if (cleanName.startsWith('_')) {
                        // Inline level (_)
                        let propName = cleanName.substring(1);
                        if (propName === 'bold') cssProp = 'font-weight: bold;';
                        else if (propName === 'italic') cssProp = 'font-style: italic;';
                        else if (propName === 'color') cssProp = `color: ${val};`;
                        else if (propName === 'fontsize') cssProp = `font-size: ${val}rem;`;
                        else cssProp = `${propName.replace(/_/g, '-')}: ${val || 'initial'};`;
                        inlineStyles.push(cssProp);
                    }
                });

                // Assemble Layers (Innermost → Outermost: Inline → Inline-Block → Block)
                let assembledHTML = innerContent;

                // 1. Inline Layer (span)
                if (inlineStyles.length > 0) {
                    assembledHTML = `<span style="${inlineStyles.join(' ')}">${assembledHTML}</span>`;
                }

                // 2. Inline-Block Layer (div with display: inline-block)
                if (inlineBlockStyles.length > 0 || attrList.some(a => a.startsWith('_i'))) {
                    let ibStyles = `display: inline-block; ${inlineBlockStyles.join(' ')}`;
                    assembledHTML = `<div style="${ibStyles}">${assembledHTML}</div>`;
                }

                // 3. Block Layer (div)
                if (blockStyles.length > 0) {
                    assembledHTML = `<div style="${blockStyles.join(' ')}">${assembledHTML}</div>`;
                }

                // If no attributes provided at all, just return content
                if (blockStyles.length === 0 && inlineBlockStyles.length === 0 && inlineStyles.length === 0) {
                    assembledHTML = `<span>${innerContent}</span>`;
                }

                // Replace current TOBj token with generated HTML
                currentText = currentText.replace(fullMatch, assembledHTML);
            }

            return currentText;
        }

        // Update preview & local storage on input
        input.addEventListener('input', () => {
            updatePreview();
            localStorage.setItem('tobj_content', input.value);
        });

        function updatePreview() {
            const text = input.value;
            stats.textContent = `${text.length} chars`;
            
            try {
                const renderedHTML = parseTOBj(text);
                preview.innerHTML = `
                    <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4 bg-gray-50 dark:bg-gray-900/50 mb-4">
                        <div class="text-xs font-bold text-gray-400 uppercase mb-2">Visual Render:</div>
                        <div class="p-3 bg-white dark:bg-gray-800 rounded border border-gray-100 dark:border-gray-700 shadow-xs">
                            ${renderedHTML}
                        </div>
                    </div>
                    <div>
                        <div class="text-xs font-bold text-gray-400 uppercase mb-2">Generated HTML Code:</div>
                        <pre class="p-3 bg-gray-900 text-purple-300 rounded font-mono text-xs overflow-x-auto">${escapeHTML(renderedHTML)}</pre>
                    </div>
                `;
            } catch (err) {
                preview.innerHTML = `<span class="text-red-500 text-xs">Parsing error: ${err.message}</span>`;
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Helper Insertion Buttons
        function insertSnippet(attr, content) {
            const start = input.selectionStart;
            const text = input.value;
            const snippet = `{[ ${attr} ]} [[${content}]]`;
            input.value = text.substring(0, start) + snippet + text.substring(start);
            input.focus();
            updatePreview();
            localStorage.setItem('tobj_content', input.value);
        }

        function insertRule5Example() {
            input.value = "{[ __center; _i_ibgcolor(#eee); _bold; _color(red) ]} [[Hello World]]";
            updatePreview();
            localStorage.setItem('tobj_content', input.value);
        }

        // Utility Actions
        function copyTOBj() {
            navigator.clipboard.writeText(input.value).then(() => {
                showToast("Copied TOBj syntax to clipboard!");
            });
        }

        function copyHTML() {
            const renderedHTML = parseTOBj(input.value);
            navigator.clipboard.writeText(renderedHTML).then(() => {
                showToast("Converted to HTML and copied to clipboard!");
            });
        }

        function clearEditor() {
            if (confirm("Are you sure you want to clear the editor?")) {
                input.value = "";
                updatePreview();
                localStorage.removeItem('tobj_content');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        // Initial Render
        updatePreview();
    </script>
</body>
</html>
