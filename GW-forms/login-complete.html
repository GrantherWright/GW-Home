<!DOCTYPE html>
<html>
<head>
    <title>Login Complete</title>
</head>
<body>
    <h2>✅ Login Complete</h2>
    <p>Refreshing main page...</p>
    <script>
        // This works on local, GitHub, and PythonAnywhere
        if (window.opener) {
            // Direct reload - works everywhere
            window.opener.location.reload();
        } else {
            // Fallback: reload this page (shouldn't happen)
            window.location.reload();
        }
        setTimeout(function() {
            window.close();
        }, 500);
    </script>
</body>
</html>
