<!DOCTYPE html>
<html>
<head>
    <title>Login Complete</title>
</head>
<body>
    <h2>✅ Login Complete</h2>
    <p>Refreshing main page...</p>
    <script>
        if (window.opener) {
            window.opener.postMessage('clerk_login_reload', '*');
        }
        setTimeout(function() {
            window.close();
        }, 300);
    </script>
</body>
</html>
