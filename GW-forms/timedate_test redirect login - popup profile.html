<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>US Central Time</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f8f9fa;
        }
        #auth {
            background: white;
            padding: 12px 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        #auth button {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        #auth button:hover {
            background: #4338ca;
        }
        #auth button.logout {
            background: #e5e7eb;
            color: #333;
        }
        #auth button.logout:hover {
            background: #d1d5db;
        }
        #auth .profile-link {
            color: #4f46e5;
            text-decoration: none;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 4px;
            background: #eef2ff;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }
        #auth .profile-link:hover {
            background: #e0e7ff;
            text-decoration: underline;
        }
        #status {
            font-size: 13px;
            color: #666;
            margin: 8px 0 12px 0;
        }
        h2 {
            color: #1a1a2e;
            margin: 20px 0 10px 0;
        }
        #time {
            font-size: 28px;
            font-weight: 500;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-top: 12px;
            text-align: center;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button.refresh {
            padding: 8px 24px;
            border: none;
            border-radius: 8px;
            background: #e5e7eb;
            color: #333;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
        }
        button.refresh:hover {
            background: #d1d5db;
        }
        #debug {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
        }
        #debug button {
            padding: 4px 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 12px;
        }
        #debug button:hover {
            background: #f3f4f6;
        }
    </style>
</head>
<body>
    <div id="auth"></div>
    <div id="status"></div>
    <h2>🕐 US Central Time</h2>
    <button class="refresh" onclick="getTime()">Refresh</button>
    <div id="time">Click button</div>
    <div id="debug"></div>

    <script>
        const clerkPublishableKey = 'pk_test_c2V0LXRvcnRvaXNlLTMxODkuY2xlcmsuYWNjb3VudHMuZGV2JA';
        const ACCOUNTS_DOMAIN = 'https://set-tortoise-3189.accounts.dev';
        let popupWindow = null;

        (function() {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js';
            script.async = true;
            script.setAttribute('data-clerk-publishable-key', clerkPublishableKey);

            script.addEventListener('load', async function() {
                console.log('✅ Clerk script loaded');

                try {
                    await window.Clerk.load();
                    console.log('✅ Clerk loaded');

                    const clerk = window.Clerk;
                    window.clerk = clerk;

                    function updateAuthUI() {
                        const authDiv = document.getElementById('auth');
                        const statusDiv = document.getElementById('status');

                        if (clerk.user) {
                            authDiv.innerHTML = `
                                👤 ${clerk.user.primaryEmailAddress?.emailAddress || clerk.user.emailAddress}
                                <button class="profile-link" onclick="openProfilePopup()">⚙️ Profile</button>
                                <button class="logout" onclick="clerk.signOut()">Logout</button>
                            `;
                            statusDiv.textContent = '✅ Authenticated';
                            statusDiv.style.color = '#16a34a';
                            if (popupWindow && !popupWindow.closed) {
                                popupWindow.close();
                                popupWindow = null;
                            }
                        } else {
                            authDiv.innerHTML = `<button onclick="openSignInPopup()">Login</button>`;
                            statusDiv.textContent = '🔒 Not logged in';
                            statusDiv.style.color = '#999';
                        }
                    }

                    // Open sign-in in popup
                    window.openSignInPopup = function() {
                        const signInUrl = ACCOUNTS_DOMAIN + '/sign-in?redirect_url=' + encodeURIComponent(window.location.href);
                        console.log('🔍 Opening sign-in popup:', signInUrl);

                        const width = 450;
                        const height = 600;
                        const left = (screen.width - width) / 2;
                        const top = (screen.height - height) / 2;

                        popupWindow = window.open(
                            signInUrl,
                            'Clerk Sign In',
                            `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
                        );

                        if (!popupWindow || popupWindow.closed) {
                            alert('Popup was blocked. Redirecting to sign-in page...');
                            window.location.href = signInUrl;
                            return;
                        }

                        // Monitor popup for close
                        const checkPopup = setInterval(() => {
                            if (popupWindow && popupWindow.closed) {
                                clearInterval(checkPopup);
                                console.log('📂 Sign-in popup closed');
                                if (clerk.user) {
                                    console.log('✅ User is logged in!');
                                    updateAuthUI();
                                    window.getTime();
                                }
                            }
                        }, 1000);

                        window.addEventListener('focus', function onFocus() {
                            if (clerk.user) {
                                console.log('✅ User is now logged in!');
                                updateAuthUI();
                                window.getTime();
                                window.removeEventListener('focus', onFocus);
                            }
                        });
                    };

                    // Open profile in popup
                    window.openProfilePopup = function() {
                        const profileUrl = ACCOUNTS_DOMAIN + '/user';
                        console.log('🔍 Opening profile popup:', profileUrl);

                        const width = 450;
                        const height = 600;
                        const left = (screen.width - width) / 2;
                        const top = (screen.height - height) / 2;

                        popupWindow = window.open(
                            profileUrl,
                            'Profile Settings',
                            `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
                        );

                        if (!popupWindow || popupWindow.closed) {
                            alert('Popup was blocked. Redirecting to profile page...');
                            window.location.href = profileUrl;
                            return;
                        }

                        console.log('✅ Profile popup opened. Close the window to return.');

                        // Monitor popup for close
                        const checkPopup = setInterval(() => {
                            if (popupWindow && popupWindow.closed) {
                                clearInterval(checkPopup);
                                console.log('📂 Profile popup closed');
                                if (!clerk.user) {
                                    console.log('⚠️ User logged out');
                                    updateAuthUI();
                                }
                            }
                        }, 1000);
                    };

                    window.getTime = async function() {
                        const timeDiv = document.getElementById('time');
                        const statusDiv = document.getElementById('status');
                        const debugDiv = document.getElementById('debug');

                        if (!clerk.user) {
                            timeDiv.textContent = 'Please login first';
                            return;
                        }

                        timeDiv.textContent = '⏳ Loading...';

                        try {
                            const token = await clerk.session?.getToken();
                            console.log('🔑 Token obtained:', token ? 'Yes' : 'No');

                            debugDiv.innerHTML = `
                                <strong>Debug Info:</strong><br>
                                Token length: ${token ? token.length : 0}<br>
                                Token preview: ${token ? token.substring(0, 50) + '...' : 'None'}<br>
                                <button onclick="copyToken()">Copy Token to Clipboard</button>
                            `;

                            const response = await fetch('https://grantherwright.pythonanywhere.com/timedate', {
                                headers: {
                                    'Authorization': `Bearer ${token}`,
                                    'Content-Type': 'application/json'
                                }
                            });

                            if (!response.ok) {
                                const errorText = await response.text();
                                throw new Error(`HTTP ${response.status}: ${errorText}`);
                            }

                            const text = await response.text();
                            timeDiv.textContent = text;
                            statusDiv.textContent = '✅ Time updated';
                            statusDiv.style.color = '#16a34a';
                        } catch (error) {
                            console.error('❌ Error fetching time:', error);
                            timeDiv.textContent = `❌ Error: ${error.message}`;
                            statusDiv.textContent = '❌ Failed to fetch time';
                            statusDiv.style.color = '#dc2626';
                        }
                    };

                    window.copyToken = async function() {
                        const token = await clerk.session?.getToken();
                        if (token) {
                            navigator.clipboard.writeText(token);
                            alert('Token copied to clipboard!');
                        }
                    };

                    clerk.addListener(() => {
                        updateAuthUI();
                        if (clerk.user) {
                            window.getTime();
                        }
                    });

                    updateAuthUI();
                    if (clerk.user) {
                        window.getTime();
                    }

                } catch (error) {
                    console.error('❌ Failed to initialize Clerk:', error);
                    document.getElementById('status').textContent = '❌ Clerk initialization failed: ' + error.message;
                    document.getElementById('status').style.color = '#dc2626';
                }
            });

            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
