<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBj Studio - Word-Style Ribbon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { height: 3px; width: 3px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

        .theme-block { background-color: #ffffff; border-color: #bae6fd; color: #0369a1; }
        .theme-block:hover { background-color: #f0f9ff; }
        .theme-block svg { stroke: #0369a1; }

        .theme-iblock { background-color: #ffffff; border-color: #7dd3fc; color: #0284c7; }
        .theme-iblock:hover { background-color: #e0f2fe; }
        .theme-iblock svg { stroke: #0284c7; }

        .theme-inline { background-color: #ffffff; border-color: #bfdbfe; color: #1d4ed8; }
        .theme-inline:hover { background-color: #eff6ff; }
        .theme-inline svg { stroke: #1d4ed8; }

        .ribbon-btn.active, .theme-block.active, .theme-iblock.active, .theme-inline.active {
            background-color: #eff6ff !important;
            border-color: #3b82f6 !important;
            color: #1d4ed8 !important;
            box-shadow: 0 0 0 1px #3b82f6 inset !important;
            font-weight: 600;
        }
        .ribbon-btn.active svg, .active svg { stroke: #1d4ed8 !important; }

        .ribbon-control { position: relative; display: inline-flex; align-items: center; }

        .pill-wrapper {
            display: inline-flex;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 9999px;
            padding: 2px;
            gap: 2px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
        }
        .pill-wrapper .ribbon-btn {
            border-radius: 9999px !important;
            border: none !important;
        }
        .pill-wrapper .ribbon-btn.active {
            background-color: #3b82f6 !important;
            color: #ffffff !important;
            box-shadow: none !important;
        }
        .pill-wrapper .ribbon-btn.active svg {
            stroke: #ffffff !important;
        }

        .reset-badge {
            display: none;
            font-size: 11px;
            font-weight: bold;
            padding: 0 2px;
            color: #94a3b8;
            cursor: pointer;
            line-height: 1;
        }
        label.active .reset-badge { display: inline-block; }
        .reset-badge:hover { color: #ef4444; }

        .input-valid { border-color: #22c55e !important; background-color: rgba(34, 197, 94, 0.05) !important; }
        .input-invalid { border-color: #ef4444 !important; background-color: rgba(239, 68, 68, 0.05) !important; }

        .no-zoom-input {
            font-size: 16px !important;
            transform: scale(0.65);
            transform-origin: left center;
            width: calc(100% / 0.65);
            margin-right: calc(-1 * (100% / 0.65 - 100%));
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-700 font-sans select-none m-0 p-1 overflow-x-hidden">

    <div id="stacked-ribbon" class="space-y-1.5 w-full max-w-7xl mx-auto"></div>
    <div id="custom-tooltip" class="fixed z-50 px-2 py-1 text-[10px] leading-tight bg-slate-900 text-slate-100 border border-slate-700 rounded shadow-xl pointer-events-none hidden max-w-[240px] break-words whitespace-normal transition-opacity duration-100 opacity-0"></div>

          "_color": { type: "inline", label: "Color", category: "Colors", behavior: "freestanding", control: "color", syntax: "_color(value)", result: "Text color", icon: "droplet", theme: "theme-inline" },
          "_bgcolor": { type: "inline", label: "Bg Color", category: "Colors", behavior: "freestanding", control: "color", syntax: "_bgcolor(value)", result: "Background color", icon: "palette", theme: "theme-inline" },
          "_fontfamily": { type: "inline", label: "Font Family", category: "Text Styling", behavior: "freestanding", control: "select", options: ["Georgia", "Arial", "Verdana", "Times New Roman", "Courier New", "Helvetica", "Palatino", "Garamond", "Comic Sans MS", "Tahoma", "Trebuchet MS", "Impact", "Lucida Console", "Monaco", "Cursive"], default: "", syntax: "_fontfamily(value)", result: "Font family", icon: "type", theme: "theme-inline" },
          "_fontsize": { type: "inline", label: "Font Size", category: "Spacing", behavior: "freestanding", control: "text", validate: "css_size", default: "5.0", syntax: "_fontsize(value)", result: "Font size", icon: "type", theme: "theme-inline" },
          "_letter_spacing": { type: "inline", label: "Letter Space", category: "Spacing", behavior: "freestanding", control: "text", validate: "css_size", default: "0.1em", syntax: "_letter_spacing(value)", result: "Letter space", icon: "space", theme: "theme-inline" },
          "_word_spacing": { type: "inline", label: "Word Space", category: "Spacing", behavior: "freestanding", control: "text", validate: "css_size", default: "0.2em", syntax: "_word_spacing(value)", result: "Word space", icon: "space", theme: "theme-inline" },
          "_line_height": { type: "inline", label: "Line Height", category: "Spacing", behavior: "freestanding", control: "text", validate: "number", default: "1.5", syntax: "_line_height(value)", result: "Line height", icon: "list", theme: "theme-inline" },
          "_font_weight": { type: "inline", label: "Font Weight", category: "Text Styling", behavior: "freestanding", control: "text", validate: "text", default: "700", syntax: "_font_weight(value)", result: "Font weight", icon: "bold", theme: "theme-inline" },
          "_text_outline": { type: "inline", label: "Text Outline", category: "Text Styling", behavior: "freestanding", control: "text", validate: "text", default: "1px #333", syntax: "_text_outline(value)", result: "Text outline", icon: "pen-tool", theme: "theme-inline" },

          "_superscript": { type: "inline", label: "Superscript", category: "Special", behavior: "checkbox", control: "toggle", syntax: "_superscript", result: "Superscript", icon: "superscript", theme: "theme-inline" },
          "_subscript": { type: "inline", label: "Subscript", category: "Special", behavior: "checkbox", control: "toggle", syntax: "_subscript", result: "Subscript", icon: "subscript", theme: "theme-inline" },
          "_clickme_str": { type: "inline", label: "ClickMe", category: "Special", behavior: "checkbox", control: "toggle", syntax: "_clickme_str", result: "Glass button", icon: "mouse-pointer", theme: "theme-inline" },
          "_tab": { type: "inline", label: "Tab", category: "Special", behavior: "checkbox", control: "toggle", syntax: "_tab", result: "Tab indent", icon: "indent", theme: "theme-inline" }
        };

        const tiers = [
            { key: "block", title: "Block" },
            { key: "inlineblock", title: "Inline-Block" },
            { key: "inline", title: "Inline" }
        ];

        const container = document.getElementById('stacked-ribbon');
        const tooltip = document.getElementById('custom-tooltip');
        let activeTouchTimer = null;

        function attachTooltip(element, tooltipText) {
            const show = () => {
                tooltip.textContent = tooltipText;
                tooltip.classList.remove('hidden');
                const rect = element.getBoundingClientRect();
                let left = rect.left + (rect.width / 2) - (tooltip.offsetWidth / 2);
                let top = rect.bottom + 4;
                if (left < 4) left = 4;
                if (left + 240 > window.innerWidth) left = window.innerWidth - 245;
                if (top + 45 > window.innerHeight) top = rect.top - 38;
                tooltip.style.left = `${left}px`;
                tooltip.style.top = `${top}px`;
                setTimeout(() => tooltip.classList.remove('opacity-0'), 10);
            };
            const hide = () => {
                tooltip.classList.add('opacity-0');
                setTimeout(() => tooltip.classList.add('hidden'), 100);
            };
            element.addEventListener('mouseenter', show);
            element.addEventListener('mouseleave', hide);
            element.addEventListener('touchstart', () => {
                show();
                if (activeTouchTimer) clearTimeout(activeTouchTimer);
                activeTouchTimer = setTimeout(hide, 2500);
            }, { passive: true });
        }

        tiers.forEach(tier => {
            const tierSection = document.createElement('fieldset');
            tierSection.className = "border border-slate-300 rounded px-2 pb-1.5 pt-0.5 m-0 bg-white shadow-2xs";
            
            const tierLegend = document.createElement('legend');
            tierLegend.className = "text-[10px] font-bold uppercase tracking-wider text-slate-500 px-1 bg-white";
            tierLegend.textContent = tier.title;
            tierSection.appendChild(tierLegend);

            const catMap = {};
            for (const [key, attr] of Object.entries(REG_ATTR)) {
                if (attr.type === tier.key) {
                    const cat = attr.category || "General";
                    if (!catMap[cat]) catMap[cat] = [];
                    catMap[cat].push({ key, ...attr });
                }
            }

            const wrapContainer = document.createElement('div');
            wrapContainer.className = "flex flex-wrap gap-1.5 items-center";

            for (const [catName, items] of Object.entries(catMap)) {
                const radioGroups = {};
                const otherItems = [];

                items.forEach(item => {
                    if (item.behavior === 'radio' && item.group) {
                        if (!radioGroups[item.group]) radioGroups[item.group] = [];
                        radioGroups[item.group].push(item);
                    } else {
                        otherItems.push(item);
                    }
                });

                if (otherItems.length > 0) {
                    const subBox = document.createElement('div');
                    subBox.className = "bg-slate-50 border border-slate-200 rounded p-1 flex flex-wrap gap-1 items-center";
                    
                    otherItems.forEach(item => {
                        subBox.appendChild(renderControl(item));
                    });
                    wrapContainer.appendChild(subBox);
                }

                for (const [groupName, groupItems] of Object.entries(radioGroups)) {
                    const pillBox = document.createElement('div');
                    pillBox.className = "pill-wrapper";
                    pillBox.setAttribute('data-radio-group', groupName);

                    groupItems.forEach(item => {
                        pillBox.appendChild(renderControl(item, pillBox));
                    });
                    wrapContainer.appendChild(pillBox);
                }
            }

            tierSection.appendChild(wrapContainer);
            container.appendChild(tierSection);
        });

        function renderControl(item, pillContainer = null) {
            const controlDiv = document.createElement('div');
            controlDiv.className = "ribbon-control";
            controlDiv.setAttribute('data-key', item.key);
            const tooltipText = `${item.type}: ${item.label}: ${item.result}`;
            const iconName = item.icon || 'circle';

            if (item.control === "toggle") {
                const btn = document.createElement('button');
                btn.className = `ribbon-btn p-1 rounded border transition-all cursor-pointer flex items-center justify-center shadow-2xs ${item.theme}`;
                btn.innerHTML = `<i data-lucide="${iconName}" class="w-3.5 h-3.5"></i>`;
                attachTooltip(btn, tooltipText);

                btn.addEventListener('click', () => {
                    if (item.behavior === 'radio' && pillContainer) {
                        // Deactivate any currently active item in this radio group
                        pillContainer.querySelectorAll('.ribbon-control').forEach(rc => {
                            if (rc.classList.contains('active')) {
                                rc.classList.remove('active');
                                const oldKey = rc.getAttribute('data-key');
                                const oldItem = REG_ATTR[oldKey];
                                if (oldItem) {
                                    window.parent.postMessage({ action: 'tobj_insert', syntax: oldItem.syntax, key: oldKey, active: false }, '*');
                                }
                            }
                        });
                        pillContainer.querySelectorAll('.ribbon-btn').forEach(b => b.classList.remove('active'));
                        
                        controlDiv.classList.add('active');
                        btn.classList.add('active');
                        window.parent.postMessage({ action: 'tobj_insert', syntax: item.syntax, key: item.key, active: true }, '*');
                    } else {
                        controlDiv.classList.toggle('active');
                        btn.classList.toggle('active');
                        const isActive = btn.classList.contains('active');
                        window.parent.postMessage({ action: 'tobj_insert', syntax: item.syntax, key: item.key, active: isActive }, '*');
                    }
                });
                controlDiv.appendChild(btn);

            } else if (item.control === "color") {
                const wrap = document.createElement('label');
                wrap.className = `ribbon-btn p-1 rounded border transition-all cursor-pointer flex items-center gap-0.5 shadow-2xs ${item.theme}`;
                wrap.innerHTML = `
                    <i data-lucide="${iconName}" class="w-3.5 h-3.5"></i>
                    <input type="color" value="#000000" class="w-3 h-3 opacity-90 cursor-pointer bg-transparent border-0">
                    <span class="reset-badge" title="Clear color">×</span>
                `;
                attachTooltip(wrap, tooltipText);
                
                const input = wrap.querySelector('input');
                input.addEventListener('change', (e) => {
                    controlDiv.classList.add('active');
                    wrap.classList.add('active');
                    const finalSyntax = item.syntax.replace('{value}', e.target.value);
                    window.parent.postMessage({ action: 'tobj_insert', syntax: finalSyntax, key: item.key, active: true }, '*');
                });

                wrap.querySelector('.reset-badge').addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    controlDiv.classList.remove('active');
                    wrap.classList.remove('active');
                    input.value = "#000000";
                    window.parent.postMessage({ action: 'tobj_insert', syntax: '', key: item.key, active: false }, '*');
                });

                controlDiv.appendChild(wrap);

            } else if (item.control === "select") {
                const selectWrap = document.createElement('div');
                selectWrap.className = `flex items-center border rounded px-1 py-0.5 gap-1 ${item.theme}`;
                
                const iconSpan = document.createElement('span');
                iconSpan.className = "flex items-center p-0.5";
                iconSpan.innerHTML = `<i data-lucide="${iconName}" class="w-3.5 h-3.5"></i>`;

                const select = document.createElement('select');
                select.className = "no-zoom-input px-1 py-0.5 rounded border bg-white text-slate-800 border-slate-300 cursor-pointer focus:outline-none";
                
                const defaultOpt = document.createElement('option');
                defaultOpt.value = "";
                defaultOpt.textContent = "Default / None";
                select.appendChild(defaultOpt);

                item.options.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt;
                    select.appendChild(option);
                });

                selectWrap.appendChild(iconSpan);
                selectWrap.appendChild(select);
                attachTooltip(selectWrap, tooltipText);

                select.addEventListener('change', (e) => {
                    const valSelect = e.target.value;
                    if (valSelect === "") {
                        controlDiv.classList.remove('active');
                        selectWrap.classList.remove('active');
                        window.parent.postMessage({ action: 'tobj_insert', syntax: '', key: item.key, active: false }, '*');
                    } else {
                        controlDiv.classList.add('active');
                        selectWrap.classList.add('active');
                        const finalSyntax = item.syntax.replace('{value}', valSelect);
                        window.parent.postMessage({ action: 'tobj_insert', syntax: finalSyntax, key: item.key, active: true }, '*');
                    }
                });
                controlDiv.appendChild(selectWrap);

            } else if (item.control === "text") {
                const inputWrap = document.createElement('div');
                inputWrap.className = `flex items-center border rounded px-1 py-0.5 gap-0.5 ${item.theme}`;
                
                const iconSpan = document.createElement('span');
                iconSpan.className = "flex items-center p-0.5";
                iconSpan.innerHTML = `<i data-lucide="${iconName}" class="w-3 h-3"></i>`;
                
                const input = document.createElement('input');
                input.type = "text";
                input.value = item.default || "";
                input.className = "no-zoom-input w-11 bg-white text-slate-900 border border-slate-300 rounded focus:outline-none px-0.5";
                
                inputWrap.appendChild(iconSpan);
                inputWrap.appendChild(input);
                attachTooltip(inputWrap, tooltipText);

                const validateAndSend = () => {
                    const valText = input.value.trim();
                    if (valText === "") {
                        input.value = item.default || "";
                        controlDiv.classList.remove('active');
                        inputWrap.classList.remove('active');
                        window.parent.postMessage({ action: 'tobj_insert', syntax: '', key: item.key, active: false }, '*');
                        return;
                    }

                    const ruleKey = item.validate || "text";
                    const pattern = REGEX_RULES[ruleKey] || REGEX_RULES.text;

                    if (pattern.test(valText)) {
                        input.classList.remove('input-invalid');
                        input.classList.add('input-valid');
                        controlDiv.classList.add('active');
                        inputWrap.classList.add('active');
                        setTimeout(() => input.classList.remove('input-valid'), 600);

                        const finalSyntax = item.syntax.replace('{value}', valText);
                        window.parent.postMessage({ action: 'tobj_insert', syntax: finalSyntax, key: item.key, active: true }, '*');
                    } else {
                        input.classList.remove('input-valid');
                        input.classList.add('input-invalid');
                        setTimeout(() => input.classList.remove('input-invalid'), 800);
                    }
                };

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        validateAndSend();
                        input.blur();
                    }
                });

                input.addEventListener('blur', () => {
                    validateAndSend();
                });

                controlDiv.appendChild(inputWrap);
            }

            return controlDiv;
        }

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data && data.type === 'HYDRATE_RIBBON') {
                const activeKeys = data.keys || data.styles || [];
                
                document.querySelectorAll('.ribbon-control').forEach(el => {
                    const key = el.getAttribute('data-key');
                    if (activeKeys.includes(key)) {
                        el.classList.add('active');
                        el.querySelectorAll('button, label, div').forEach(child => child.classList.add('active'));
                    } else {
                        el.classList.remove('active');
                        el.querySelectorAll('button, label, div').forEach(child => child.classList.remove('active'));
                    }
                });
            }
        });

        document.addEventListener('touchstart', (e) => {
            if (!e.target.closest('button') && !e.target.closest('input') && !e.target.closest('select') && !e.target.closest('label')) {
                tooltip.classList.add('opacity-0');
                setTimeout(() => tooltip.classList.add('hidden'), 100);
            }
        });

        // Initialize Lucide icons after dynamic DOM population
        lucide.createIcons();
    </script>
</body>
</html>
