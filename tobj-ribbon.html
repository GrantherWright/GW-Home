<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBj Studio - Ultra-Slim Ribbon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { height: 3px; width: 3px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

        .theme-block { background-color: #f0f9ff; border-color: #bae6fd; color: #0369a1; }
        .theme-block:hover { background-color: #e0f2fe; }

        .theme-iblock { background-color: #e0f2fe; border-color: #7dd3fc; color: #0284c7; }
        .theme-iblock:hover { background-color: #bae6fd; }

        .theme-inline { background-color: #1d4ed8; border-color: #2563eb; color: #ffffff; }
        .theme-inline:hover { background-color: #1e40af; }
        .theme-inline svg { stroke: #ffffff; }

        .ribbon-control { position: relative; display: inline-flex; align-items: center; }

        /* Validation States */
        .input-valid { border-color: #22c55e !important; background-color: rgba(34, 197, 94, 0.1) !important; }
        .input-invalid { border-color: #ef4444 !important; background-color: rgba(239, 68, 68, 0.1) !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans select-none m-0 p-1.5 overflow-x-hidden">

    <!-- Stacked Ultra-Slim Ribbon Container -->
    <div id="stacked-ribbon" class="space-y-1 w-full max-w-7xl mx-auto">
        <!-- Populated dynamically via script -->
    </div>

            const show = () => {
                tooltip.textContent = tooltipText;
                tooltip.classList.remove('hidden');
                const rect = element.getBoundingClientRect();
                let left = rect.left + (rect.width / 2) - (tooltip.offsetWidth / 2);
                let top = rect.bottom + 4;
                if (left < 4) left = 4;
                if (left + 220 > window.innerWidth) left = window.innerWidth - 225;
                if (top + 35 > window.innerHeight) top = rect.top - 32;
                tooltip.style.left = `${left}px`;
                tooltip.style.top = `${top}px`;
                setTimeout(() => tooltip.classList.remove('opacity-0'), 10);
            };
            const hide = () => {
                tooltip.classList.add('opacity-0');
                setTimeout(() => tooltip.classList.add('hidden'), 100);
            };
            element.addEventListener('mouseenter', show);
            element.addEventListener('mouseleave', hide);
            element.addEventListener('touchstart', (e) => {
                show();
                if (activeTouchTimer) clearTimeout(activeTouchTimer);
                activeTouchTimer = setTimeout(hide, 2500);
            }, { passive: true });
        }

        tiers.forEach(tier => {
            const tierSection = document.createElement('div');
            tierSection.className = "bg-slate-950 border border-slate-800 rounded p-1.5 shadow-sm";
            
            const tierHeader = document.createElement('h2');
            tierHeader.className = "text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 px-1 border-b border-slate-800/60 pb-0.5";
            tierHeader.textContent = tier.title;
            tierSection.appendChild(tierHeader);

            const catMap = {};
            for (const [key, attr] of Object.entries(REG_ATTR)) {
                if (attr.type === tier.key) {
                    const cat = attr.category || "General";
                    if (!catMap[cat]) catMap[cat] = [];
                    catMap[cat].push({ key, ...attr });
                }
            }

            // Single row scrollable container per tier
            const rowWrapper = document.createElement('div');
            rowWrapper.className = "flex flex-nowrap gap-2 items-center overflow-x-auto pb-0.5";

            let catIndex = 0;
            for (const [catName, items] of Object.entries(catMap)) {
                if (catIndex > 0) {
                    // Subtle vertical divider between category sections
                    const divider = document.createElement('div');
                    divider.className = "h-5 w-[1px] bg-slate-800 flex-shrink-0 mx-0.5";
                    rowWrapper.appendChild(divider);
                }
                catIndex++;

                const subBox = document.createElement('div');
                subBox.className = "bg-slate-900/40 border border-slate-800/80 rounded p-1 flex flex-nowrap gap-1 items-center flex-shrink-0";
                
                items.forEach(item => {
                    const controlDiv = document.createElement('div');
                    controlDiv.className = "ribbon-control";
                    const tooltipText = `${item.type}: ${item.label}: ${item.result}`;

                    if (item.control === "toggle") {
                        const btn = document.createElement('button');
                        btn.className = `p-1 rounded border transition-all cursor-pointer flex items-center justify-center shadow-2xs ${item.theme}`;
                        btn.innerHTML = `<i data-lucide="${item.icon || 'circle'}" class="w-3.5 h-3.5"></i>`;
                        attachTooltip(btn, tooltipText);
                        btn.addEventListener('click', () => {
                            window.parent.postMessage({ action: 'tobj_insert', syntax: item.syntax, key: item.key }, '*');
                        });
                        controlDiv.appendChild(btn);

                    } else if (item.control === "color") {
                        const wrap = document.createElement('label');
                        wrap.className = `p-1 rounded border transition-all cursor-pointer flex items-center gap-0.5 shadow-2xs ${item.theme}`;
                        wrap.innerHTML = `<i data-lucide="${item.icon || 'palette'}" class="w-3.5 h-3.5"></i><input type="color" value="#000000" class="w-3 h-3 opacity-80 cursor-pointer bg-transparent border-0">`;
                        attachTooltip(wrap, tooltipText);
                        const input = wrap.querySelector('input');
                        input.addEventListener('change', (e) => {
                            const valColor = e.target.value;
                            const finalSyntax = item.syntax.replace('{value}', valColor);
                            window.parent.postMessage({ action: 'tobj_insert', syntax: finalSyntax, key: item.key }, '*');
                        });
                        controlDiv.appendChild(wrap);

                    } else if (item.control === "select") {
                        const select = document.createElement('select');
                        select.className = "px-1.5 py-0.5 text-[11px] rounded border bg-slate-900 text-slate-200 border-slate-700 cursor-pointer focus:outline-none";
                        item.options.forEach(opt => {
                            const option = document.createElement('option');
                            option.value = opt;
                            option.textContent = opt;
                            if (opt === item.default) option.selected = true;
                            select.appendChild(option);
                        });
                        attachTooltip(select, tooltipText);
                        select.addEventListener('change', (e) => {
                            const valSelect = e.target.value;
                            const finalSyntax = item.syntax.replace('{value}', valSelect);
                            window.parent.postMessage({ action: 'tobj_insert', syntax: finalSyntax, key: item.key }, '*');
                        });
                        controlDiv.appendChild(select);

                    } else if (item.control === "text") {
                        const inputWrap = document.createElement('div');
                        inputWrap.className = "flex items-center bg-slate-900 border border-slate-700 rounded px-1 py-0.5 gap-0.5";
                        
                        const iconSpan = document.createElement('span');
                        iconSpan.className = "flex items-center text-slate-400 p-0.5";
                        iconSpan.innerHTML = `<i data-lucide="${item.icon || 'type'}" class="w-3 h-3"></i>`;
                        
                        const input = document.createElement('input');
                        input.type = "text";
                        input.value = item.default || "";
                        input.className = "w-12 text-[11px] bg-transparent text-slate-100 focus:outline-none px-0.5";
                        
                        inputWrap.appendChild(iconSpan);
                        inputWrap.appendChild(input);
                        attachTooltip(inputWrap, tooltipText);

                        const validateAndSend = () => {
                            const valText = input.value.trim();
                            const ruleKey = item.validate || "text";
                            const pattern = REGEX_RULES[ruleKey] || REGEX_RULES.text;

                            if (pattern.test(valText)) {
                                // Valid input: flash green, send message
                                input.classList.remove('input-invalid');
                                input.classList.add('input-valid');
                                setTimeout(() => input.classList.remove('input-valid'), 600);

                                const finalSyntax = item.syntax.replace('{value}', valText);
                                window.parent.postMessage({ action: 'tobj_insert', syntax: finalSyntax, key: item.key }, '*');
                            } else {
                                // Invalid input: flash red, reject
                                input.classList.remove('input-valid');
                                input.classList.add('input-invalid');
                                setTimeout(() => input.classList.remove('input-invalid'), 800);
                            }
                        };

                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') {
                                validateAndSend();
                                input.blur();
                            }
                        });

                        input.addEventListener('blur', () => {
                            validateAndSend();
                        });

                        controlDiv.appendChild(inputWrap);
                    }

                    subBox.appendChild(controlDiv);
                });

                rowWrapper.appendChild(subBox);
            }

            tierSection.appendChild(rowWrapper);
            container.appendChild(tierSection);
        });

        document.addEventListener('touchstart', (e) => {
            if (!e.target.closest('button') && !e.target.closest('input') && !e.target.closest('select') && !e.target.closest('label')) {
                tooltip.classList.add('opacity-0');
                setTimeout(() => tooltip.classList.add('hidden'), 100);
            }
        });

        lucide.createIcons();
    </script>
</body>
</html>
