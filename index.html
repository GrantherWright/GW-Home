<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrantherWright.com</title>

  <!-- 1. Load Clerk JS SDK (Replace YOUR_CLERK_PUBLISHABLE_KEY below) -->
  <script 
    async 
    crossorigin="anonymous" 
    data-clerk-publishable-key="YOUR_CLERK_PUBLISHABLE_KEY"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js">
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fcfcfc;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top Navigation Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid #eaeaea;
      background: #ffffff;
    }

    .brand {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    /* Hero Section */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 1.5rem;
    }

    /* Action Buttons & Cards */
    .btn {
      background-color: #111111;
      color: #ffffff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .btn:hover { background-color: #333333; }

    .token-box {
      margin-top: 1.5rem;
      max-width: 600px;
      width: 100%;
      text-align: left;
      background: #f4f4f5;
      padding: 1rem;
      border-radius: 6px;
      border: 1px solid #e4e4e7;
    }

    pre {
      font-family: monospace;
      font-size: 0.85rem;
      word-break: break-all;
      white-space: pre-wrap;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- Header with Brand & Top Right Login -->
  <header>
    <div class="brand">GrantherWright.com</div>
    <div id="auth-header-btn">
      <!-- Clerk Login button or User Button mounts here -->
    </div>
  </header>

  <!-- Main Hero Body -->
  <main>
    <h1>Welcome to GrantherWright!<br>Experience Creativity</h1>

    <!-- Testing Panel: Displays active JWT session token -->
    <div id="test-panel" style="display: none;">
      <button id="copy-token-btn" class="btn">Get & Copy Session JWT</button>
      <div class="token-box">
        <strong>Active Token (for testing Flask API):</strong>
        <pre id="token-display">Click the button above to fetch your token.</pre>
      </div>
    </div>
  </main>

  <script>
    window.addEventListener('load', async () => {
      // Initialize Clerk SDK
      await window.Clerk.load();

      const authHeaderBtn = document.getElementById('auth-header-btn');
      const testPanel = document.getElementById('test-panel');
      const tokenDisplay = document.getElementById('token-display');
      const copyTokenBtn = document.getElementById('copy-token-btn');

      if (window.Clerk.user) {
        // --- LOGGED IN STATE ---
        // Mount Clerk's user profile button in top right
        window.Clerk.mountUserButton(authHeaderBtn);
        
        // Show token testing panel
        testPanel.style.display = 'block';

        copyTokenBtn.onclick = async () => {
          // Fetch current session JWT
          const token = await window.Clerk.session.getToken();
          tokenDisplay.innerText = token;
          
          // Copy directly to clipboard
          navigator.clipboard.writeText(token);
          alert('JWT copied to clipboard!');
        };

      } else {
        // --- LOGGED OUT STATE ---
        // Mount simple Log In button triggering Clerk modal
        const loginBtn = document.createElement('button');
        loginBtn.className = 'btn';
        loginBtn.innerText = 'Log In';
        loginBtn.onclick = () => window.Clerk.openSignIn();
        
        authHeaderBtn.appendChild(loginBtn);
      }
    });
  </script>
</body>
</html>
